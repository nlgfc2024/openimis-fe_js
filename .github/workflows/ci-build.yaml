name: CI / Build

on:
  push:
    branches: [mw/develop, jobs-now/develop, umep/develop, 'release/mw/**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        name: Setup node v20
        with:
          node-version: "20"

      - name: Check package.json
        run: |
            npm install -g npm@latest
            npm run check-package

      - name: Prepare openIMIS Dependencies
        run: npm run load-config

      - name: Install dependencies
        run: |
            npm install  --include=dev --legacy-peer-deps

      - name: Build
        env:
          # Same as the Docker build: lint warnings are not errors.
          CI: false
        run: |
          npm run build
          test -f build/index.html

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.event_name == 'push' && github.ref_name || github.run_number }}-${{ github.sha }}
          path: ./build/*

