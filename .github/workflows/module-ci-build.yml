name: Malawi FE module build
# Reusable workflow called by every nlgfc2024/openimis-fe-*_js module repo (see their ci.yml).
#
# It builds the Malawi frontend (nlgfc2024/openimis-fe_js, with the modules its openimis.json
# pins) the same way the Docker image does, with the module under test packed from the PR
# head in place of its pinned version. Green means the module builds and the whole Malawi
# frontend compiles with it. No unit tests are run (end-to-end tests live in the dist repo).
on:
  workflow_call:
    inputs:
      fe_fallback_branch:
        description: Hub branch used when the hub has no branch matching the PR base / pushed branch
        required: false
        type: string
        default: mw/develop
      # Accepted and ignored, for callers that still pass it.
      branchName: {required: false, type: string}

env:
  HUB_REPOSITORY: nlgfc2024/openimis-fe_js

jobs:
  build_frontend:
    name: Build Malawi frontend with this module
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'   # same as the hub Dockerfile

      - name: Choose the hub branch
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSHED_REF: ${{ github.ref_name }}
          FALLBACK: ${{ inputs.fe_fallback_branch }}
        run: |
          # The hub branch named like the PR base (or the pushed branch), else the fallback.
          # Never upstream openimis: that would build against the wrong module pins.
          if [[ "$EVENT" == pull_request* ]]; then WANTED="$PR_BASE_REF"; else WANTED="$PUSHED_REF"; fi
          if [[ -n "$WANTED" ]] && git ls-remote --exit-code --heads "https://github.com/$HUB_REPOSITORY.git" "refs/heads/$WANTED" > /dev/null; then
            HUB_BRANCH="$WANTED"
          else
            HUB_BRANCH="$FALLBACK"
          fi
          echo "HUB_BRANCH=$HUB_BRANCH" >> "$GITHUB_ENV"
          echo "Wanted hub branch '$WANTED', using '$HUB_BRANCH'"

      - name: Check out the hub
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HUB_REPOSITORY }}
          ref: ${{ env.HUB_BRANCH }}
          path: openimis-fe

      - name: Check out the module under test
        uses: actions/checkout@v4
        with:
          path: current-module

      - name: Build and pack the module
        working-directory: ./current-module
        run: |
          npm install --include=dev --legacy-peer-deps
          # npm pack runs the module's prepare/build script, like a git install does.
          TARBALL=$(npm pack --silent | tail -1)
          test -f "$TARBALL"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "PACKAGE_NAME=$(jq -r .name package.json)" >> "$GITHUB_ENV"
          echo "MODULE_NAME=$(grep -oP 'export\s+(?:const\s+)?\K\w+Module(?=\s*=)' src/index.js | head -1)" >> "$GITHUB_ENV"

      - name: Use the module under test in openimis.json
        working-directory: ./openimis-fe
        run: |
          jq --arg pkg "$PACKAGE_NAME" --arg name "$MODULE_NAME" --arg npm "$PACKAGE_NAME@file:../current-module/$TARBALL" '
            if any(.modules[]; .npm | startswith($pkg + "@"))
            then (.modules[] | select(.npm | startswith($pkg + "@")) | .npm) = $npm
            else .modules += [{name: $name, npm: $npm}] end' openimis.json > openimis.json.new
          mv openimis.json.new openimis.json
          jq -c --arg pkg "$PACKAGE_NAME" '.modules[] | select(.npm | startswith($pkg + "@"))' openimis.json

      - name: Build the frontend (as the Dockerfile does)
        working-directory: ./openimis-fe
        env:
          # The Docker build does not treat lint warnings as errors; neither does this check.
          CI: false
        run: |
          npm run check-package
          npm run load-config
          npm install --include=dev --legacy-peer-deps
          npm run build
          test -f build/index.html

      - name: Summary
        if: always()
        run: |
          {
            echo "### $PACKAGE_NAME frontend build"
            echo "- Hub: \`$HUB_REPOSITORY@$HUB_BRANCH\` ($(git -C openimis-fe rev-parse --short HEAD))"
            echo "- Module: \`$GITHUB_REPOSITORY\` ($(git -C current-module rev-parse --short HEAD)), packed as \`$TARBALL\`"
          } >> "$GITHUB_STEP_SUMMARY"
